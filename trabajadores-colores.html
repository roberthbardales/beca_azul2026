<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trabajadores - Propuesta de colores</title>
    <style>
        :root {
            --primary-50: #eff6ff;
            --primary-100: #dbe8fe;
            --primary-500: #3361f1;
            --primary-600: #1557c0;
            --primary-700: #1a39b4;
            --ink-50: #f7f8fa;
            --ink-100: #eef0f4;
            --ink-200: #dde1e9;
            --ink-400: #9aa1b4;
            --ink-500: #717891;
            --ink-700: #454b61;
            --ink-900: #333647;
        }

        * { box-sizing: border-box; }

        body {
            min-width: 320px;
            margin: 0;
            background: var(--ink-50);
            color: var(--ink-900);
            font-family: Arial, sans-serif;
        }

        .sidebar {
            position: fixed;
            inset: 0 auto 0 0;
            width: 16rem;
            padding: 1.25rem 1rem;
            background: #062c4d;
            color: white;
        }

        .brand {
            padding-bottom: 1.25rem;
            border-bottom: 1px solid rgba(255, 255, 255, .12);
            font-weight: 700;
        }

        .brand small {
            display: block;
            margin-top: .35rem;
            color: rgba(255, 255, 255, .62);
            font-weight: 400;
        }

        .nav-link {
            display: block;
            margin-top: 1.5rem;
            padding: .75rem .85rem;
            border-radius: .45rem;
            color: rgba(255, 255, 255, .82);
            text-decoration: none;
        }

        .nav-link.active {
            background: var(--primary-600);
            color: white;
        }

        main {
            max-width: 80rem;
            margin-left: 16rem;
            padding: 3rem 2rem;
        }

        h1 {
            margin: 0 0 1rem;
            color: var(--ink-900);
            font-size: 1.75rem;
        }

        .filter-card {
            display: grid;
            grid-template-columns: minmax(18rem, 2fr) repeat(2, minmax(12rem, 1fr)) auto;
            gap: .75rem;
            align-items: end;
            margin-bottom: 1.5rem;
            padding: 1rem;
            border: 1px solid var(--ink-200);
            border-radius: .75rem;
            background: white;
            box-shadow: 0 1px 3px rgba(16, 24, 40, .06);
        }

        label {
            display: block;
            margin-bottom: .4rem;
            color: var(--ink-700);
            font-size: .8rem;
            font-weight: 700;
        }

        input, select {
            width: 100%;
            min-height: 2.7rem;
            padding: .55rem .85rem;
            border: 1px solid var(--ink-200);
            border-radius: .5rem;
            background: white;
            color: var(--ink-900);
            font: inherit;
        }

        input::placeholder { color: var(--ink-500); }

        input:focus, select:focus {
            border-color: var(--primary-600);
            outline: 3px solid var(--primary-100);
            outline-offset: 0;
        }

        .actions {
            display: flex;
            gap: .5rem;
        }

        button, .clear {
            min-height: 2.7rem;
            padding: .55rem 1rem;
            border-radius: .45rem;
            font: inherit;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
        }

        .search {
            border: 1px solid var(--primary-600);
            background: var(--primary-600);
            color: white;
        }

        .search:hover { background: var(--primary-700); }

        .clear {
            border: 1px solid var(--ink-200);
            background: var(--ink-50);
            color: var(--ink-700);
        }

        .clear:hover { background: var(--ink-100); }

        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .pagination p { color: var(--ink-500); font-size: .875rem; }

        .page-link {
            display: inline-block;
            padding: .55rem .8rem;
            border: 1px solid var(--ink-200);
            border-radius: .45rem;
            background: white;
            color: var(--primary-600);
            text-decoration: none;
            font-size: .875rem;
            font-weight: 700;
        }

        .page-link.current { background: var(--primary-600); color: white; }
        .page-link.disabled { color: var(--ink-500); background: var(--ink-50); cursor: not-allowed; }

        @media (max-width: 900px) {
            .filter-card { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .search-field, .actions { grid-column: 1 / -1; }
        }

        @media (max-width: 640px) {
            .sidebar { position: static; width: 100%; }
            main { margin-left: 0; padding: 1.25rem; }
            .filter-card { grid-template-columns: 1fr; }
            .search-field, .actions { grid-column: auto; }
            .actions { flex-direction: column; }
            .pagination { align-items: stretch; flex-direction: column; }
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="brand">
            Sistema de Control
            <small>Gestión operativa</small>
        </div>
        <a class="nav-link active" href="#">Trabajadores</a>
    </aside>

    <main>
        <h1>Trabajadores</h1>

        <form class="filter-card">
            <div class="search-field">
                <label for="search">Buscar trabajadores</label>
                <input id="search" type="search" placeholder="Buscar por DNI, nombre, cargo, área o empresa...">
            </div>
            <div>
                <label for="status">Estado</label>
                <select id="status">
                    <option>Todos los estados</option>
                    <option>Habilitado</option>
                    <option>No habilitado</option>
                </select>
            </div>
            <div>
                <label for="company">Empresa</label>
                <select id="company">
                    <option>Todas las empresas</option>
                    <option>Empresa Azul</option>
                    <option>Empresa Norte</option>
                </select>
            </div>
            <div class="actions">
                <button class="search" type="submit">Buscar</button>
                <a class="clear" href="#">Limpiar</a>
            </div>
        </form>

        <div class="pagination">
            <p>Mostrando 1-10 de 48 trabajadores</p>
            <nav aria-label="Paginación">
                <span class="page-link disabled">Anterior</span>
                <span class="page-link current">1</span>
                <a class="page-link" href="#">2</a>
                <a class="page-link" href="#">Siguiente</a>
            </nav>
        </div>
    </main>
</body>
</html>
