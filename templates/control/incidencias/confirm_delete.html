{% extends 'base.html' %}
{% block content %}
<div class="control-confirmation-page flex justify-center py-2"><div class="w-full max-w-lg">
    <form method="post" class="control-confirmation rounded-xl border border-red-200 bg-white p-6 shadow-sm sm:p-8">
        {% csrf_token %}
        <header class="control-confirmation-header mb-5 border-b border-red-100 pb-5"><h1 class="text-2xl font-bold text-[#0f172a]">Eliminar incidencia</h1><p class="mt-2 text-sm text-[#616161]">Esta acción es permanente y no se puede deshacer.</p></header>
        <section aria-label="Incidencia a eliminar" class="mb-6 rounded-lg border border-red-100 bg-red-50 px-4 py-3"><p class="text-xs font-semibold uppercase tracking-wide text-red-700">Incidencia seleccionada</p><p class="mt-1 text-sm text-[#616161]">{{ incidencia.descripcion }}</p><p class="mt-1 font-semibold text-[#0f172a]">{{ incidencia.trabajador }}</p></section>
        <footer class="control-action-bar flex flex-col-reverse gap-3 border-t border-red-100 pt-5 sm:flex-row sm:items-center"><button type="submit" class="btn btn-quinary">Eliminar incidencia</button><a class="btn btn-secondary" href="{% url 'app_control:trabajador_detalle' incidencia.trabajador.pk %}">Cancelar y volver</a></footer>
    </form>
</div></div>
{% endblock %}
