<section class="dashboard-feed overflow-hidden rounded-lg border border-gray-100 bg-white"
         aria-labelledby="trabajadores-recientes-title">
    <div class="flex items-start justify-between gap-4 border-b border-blue-100 bg-blue-50/60 px-4 py-3">
        <div class="flex items-start gap-3">
            <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-blue-100 text-blue-700"
                  aria-hidden="true">
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                    <circle cx="12" cy="7" r="3"/>
                    <path stroke-linecap="round" d="M5 21c.7-4 3-6 7-6s6.3 2 7 6"/>
                </svg>
            </span>
            <div>
                <h2 id="trabajadores-recientes-title" class="text-base font-semibold text-blue-900">
                    Trabajadores recientes
                </h2>
                <p class="mt-0.5 text-xs font-medium text-blue-700">Últimos registros</p>
            </div>
        </div>
        <a href="{% url 'app_control:trabajador_lista' %}"
           class="shrink-0 text-xs font-semibold text-blue-700 hover:text-blue-800">
            Ver todos
        </a>
    </div>

    <ul class="divide-y divide-gray-100">
        {% for trabajador in trabajadores_recientes %}
            <li class="px-4 py-3">
                <a href="{% url 'app_control:trabajador_detalle' trabajador.pk %}"
                   class="block rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <p class="text-sm font-medium text-[#0f172a]">{{ trabajador }}</p>
                    <p class="mt-1 text-xs text-[#A5A5A5]">
                        {{ trabajador.empresa.nombre }} · {{ trabajador.created|date:"d/m/Y" }}
                    </p>
                </a>
            </li>
        {% empty %}
            <li class="px-4 py-6 text-center text-sm text-[#A5A5A5]">
                Aún no hay trabajadores registrados.
            </li>
        {% endfor %}
    </ul>
</section>
