<section class="mt-5" aria-labelledby="metric-cursos-title">
    <h2 id="metric-cursos-title" class="mb-3 text-sm font-semibold uppercase tracking-wide text-[#64748b]">
        Cursos
    </h2>
    <div class="dashboard-course-metrics grid items-stretch gap-4 sm:grid-cols-2 lg:grid-cols-6">
        {% for curso in cursos_vigentes %}
            <article class="dashboard-metric dashboard-summary-metric dashboard-summary-card rounded-lg border border-gray-100 bg-white p-4 shadow-sm"
                     aria-labelledby="metric-curso-{{ curso.codigo|lower }}">
                <h3 id="metric-curso-{{ curso.codigo|lower }}" class="dashboard-course-title text-xs font-semibold uppercase tracking-wide text-[#A5A5A5]">
                    {{ curso.nombre }}
                </h3>
                <div class="dashboard-card-content">
                    <div class="dashboard-summary-statuses">
                        <span class="dashboard-company-status dashboard-company-status--positive"><span>Vigentes</span><strong>{{ curso.vigentes }}</strong></span>
                        <span class="dashboard-company-status dashboard-company-status--warning"><span>Por Vencer</span><strong>{{ curso.proximos_30 }}</strong></span>
                        <span class="dashboard-company-status dashboard-company-status--negative"><span>Vencidos</span><strong>{{ curso.vencidos }}</strong></span>
                    </div>
                </div>
            </article>
        {% endfor %}
    </div>
</section>
